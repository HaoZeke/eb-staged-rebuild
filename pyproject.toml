[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eb-staged-rebuild"
version = "1.0.0"
description = "Stage an EasyBuild rebuild and atomically exchange it with the live directory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rohit Goswami", email = "rgoswami@ieee.org"}]
dependencies = []

[project.scripts]
eb-staged-rebuild = "eb_staged_rebuild.cli:main"

[project.optional-dependencies]
docs = [
  "sphinx==9.1.1",
  "myst-parser==5.1.0",
  "shibuya==2025.12.13",
  "sphinx-design==0.7.0",
  "sphinx-copybutton==0.5.2",
]

[tool.setuptools.packages.find]
include = ["eb_staged_rebuild*"]

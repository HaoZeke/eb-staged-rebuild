name: release
# On a tag vX.Y.Z: build the static binaries, test each on its own
# architecture against the Python tool, check that the release binary
# carries no test hook and that its version matches the tag, and open a
# draft release with the binaries, SHA256SUMS and build provenance
# attestations.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # argparse's usage wrapping changes between Python releases; the
      # binary prints what Python 3.14 prints.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig build test --summary all
      - name: build
        run: |
          zig build -Drelease=true -Dtarget=${{ matrix.arch }}-linux-musl --prefix out
          ! grep -aq EB_STAGED_REBUILD_ACL_MODEL out/bin/eb-staged-rebuild
          ! grep -aq EB_STAGED_REBUILD_FAIL_AT out/bin/eb-staged-rebuild
          ! zig build -Dtest-ops -Drelease=true
          got=$(out/bin/eb-staged-rebuild --version)
          py=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' eb_staged_rebuild/__init__.py)
          if [ "${got}" != "eb-staged-rebuild ${GITHUB_REF_NAME#v}" ] || [ "${py}" != "${GITHUB_REF_NAME#v}" ]; then
            echo "versions: tag ${GITHUB_REF_NAME}, binary ${got}, Python ${py}"; exit 1
          fi
      - name: the release binary against the Python tool
        run: |
          zig build -Dtest-ops
          TOOL_BIN="$PWD/out/bin/eb-staged-rebuild" bash tests/differential.sh
          TOOL_BIN="$PWD/out/bin/eb-staged-rebuild" python tests/crash_matrix.py
          TOOL_BIN="$PWD/out/bin/eb-staged-rebuild" python tests/signal_harness.py
          TOOL_BIN_TEST_OPS="$PWD/zig-out/bin/eb-staged-rebuild-test-ops" python tests/fail_matrix.py
          TOOL_BIN="$PWD/out/bin/eb-staged-rebuild" python tests/differential_metadata.py
      - name: package
        run: |
          mkdir dist
          cp out/bin/eb-staged-rebuild "dist/eb-staged-rebuild-${GITHUB_REF_NAME#v}-${{ matrix.arch }}-linux-musl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.arch }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum eb-staged-rebuild-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*
      # A draft: release assets cannot change once a release is published,
      # so every asset is attached before a person publishes it.
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file /dev/null --draft

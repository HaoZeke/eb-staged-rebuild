name: pinned ledger CLI
description: Build the eb-stack 0.5.2 ledger CLI the ledger tests run against.
runs:
  using: composite
  steps:
    - name: build ledger CLI
      shell: bash
      run: |
        set -euo pipefail
        ledger_source="$RUNNER_TEMP/eb-stack-c95bdcd"
        archive="$RUNNER_TEMP/eb-stack-c95bdcd.tar.gz"
        curl -fsSL --retry 3 --connect-timeout 15 https://codeload.github.com/HaoZeke/eb-stack/tar.gz/c95bdcd0983a203aa097c947f9f83f89e3e9fc43 -o "$archive"
        printf '%s  %s\n' 7aa248b8648ceefeb250cd6bec30c6ccb71364d5067930481564a517868d9a1f "$archive" | sha256sum --check -
        mkdir "$ledger_source"
        tar -xzf "$archive" --strip-components=1 -C "$ledger_source"
        rustup toolchain install 1.90.0 --profile minimal
        cargo +1.90.0 build --manifest-path "$ledger_source/Cargo.toml" --locked --release --bin eb-stack
        printf 'EB_STACK_BIN=%s\n' "$ledger_source/target/release/eb-stack" >> "$GITHUB_ENV"

name: pinned ledger CLI
description: Build the eb-stack 0.5.1 ledger CLI the ledger tests run against.
runs:
  using: composite
  steps:
    - name: build ledger CLI
      shell: bash
      run: |
        set -euo pipefail
        ledger_source="$RUNNER_TEMP/eb-stack-c26282c"
        archive="$RUNNER_TEMP/eb-stack-c26282c.tar.gz"
        curl -fsSL --retry 3 --connect-timeout 15 https://codeload.github.com/HaoZeke/eb-stack/tar.gz/c26282cc3a1989741d448050cacecdc27cd112ee -o "$archive"
        printf '%s  %s\n' 35a8f08c317a2f84e0cd060de26690b5b7074f5f5c235e844d80a8c3e94ccf22 "$archive" | sha256sum --check -
        mkdir "$ledger_source"
        tar -xzf "$archive" --strip-components=1 -C "$ledger_source"
        rustup toolchain install 1.90.0 --profile minimal
        cargo +1.90.0 build --manifest-path "$ledger_source/Cargo.toml" --locked --release --bin eb-stack
        printf 'EB_STACK_BIN=%s\n' "$ledger_source/target/release/eb-stack" >> "$GITHUB_ENV"

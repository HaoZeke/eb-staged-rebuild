name: pinned ledger CLI
description: Build the eb-stack 0.7.0 ledger CLI the ledger tests run against.
runs:
  using: composite
  steps:
    - name: build ledger CLI
      shell: bash
      run: |
        set -euo pipefail
        ledger_source="$RUNNER_TEMP/eb-stack-defb6ae"
        archive="$RUNNER_TEMP/eb-stack-defb6ae.tar.gz"
        curl -fsSL --retry 3 --connect-timeout 15 https://codeload.github.com/stackhands/eb-stack/tar.gz/defb6ae742ef9a56c23aa12280745423c8d46b9a -o "$archive"
        printf '%s  %s\n' 002f37ce87cf63115709035b84203a3f0d8fd6d79d031476bfb23e3af01bc730 "$archive" | sha256sum --check -
        mkdir "$ledger_source"
        tar -xzf "$archive" --strip-components=1 -C "$ledger_source"
        rustup toolchain install 1.90.0 --profile minimal
        cargo +1.90.0 build --manifest-path "$ledger_source/Cargo.toml" --locked --release --bin eb-stack
        printf 'EB_STACK_BIN=%s\n' "$ledger_source/target/release/eb-stack" >> "$GITHUB_ENV"
